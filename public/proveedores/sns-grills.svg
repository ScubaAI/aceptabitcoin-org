<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <!-- Asador (triángulo del logo oficial) -->
  <path
    d="M 60 40 L 140 40 L 100 120 Z"
    fill="none"
    stroke="#FAFAFA"
    stroke-width="6"
    stroke-linejoin="round"
  />

  <!-- Llama interior (onda de fuego del logo oficial) -->
  <path
    d="M 68 65 C 80 45, 90 85, 100 65 C 110 45, 120 85, 132 65"
    fill="none"
    stroke="#FAFAFA"
    stroke-width="5"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Nombre -->
  <text
    x="100"
    y="158"
    font-family="Montserrat, 'Arial Black', sans-serif"
    font-weight="900"
    font-size="21"
    fill="#FAFAFA"
    text-anchor="middle"
    letter-spacing="1"
  >SNS GRILLS</text>

  <!-- Categoría -->
  <text
    x="100"
    y="176"
    font-family="Montserrat, Arial, sans-serif"
    font-weight="600"
    font-size="9"
    fill="#FAFAFA"
    text-anchor="middle"
    letter-spacing="3"
  >ASADORES</text>
</svg>