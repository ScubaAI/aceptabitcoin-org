<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <!-- Arco de horizonte (el "domo" de Arcadia) -->
  <path
    d="M 42 88 Q 100 24 158 88"
    fill="none" stroke="#FAFAFA" stroke-width="5" stroke-linecap="round"
  />

  <!-- Anillo de la ₿ -->
  <circle cx="100" cy="96" r="24" fill="none" stroke="#FAFAFA" stroke-width="4" />

  <!-- Órbita abierta (el swoosh que abraza la ₿ en el original) -->
  <path
    d="M 89.7 124.2 A 30 30 0 1 0 89.7 67.8"
    fill="none" stroke="#FAFAFA" stroke-width="3" stroke-linecap="round"
  />

  <!-- Glifo ₿ -->
  <g fill="none" stroke="#FAFAFA" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 92 82 V 110" />
    <path d="M 92 82 H 101 A 7 7 0 0 1 101 96 H 92" />
    <path d="M 92 96 H 102 A 7 7 0 0 1 102 110 H 92" />
    <path d="M 96 77 V 82 M 103 77 V 82" />
    <path d="M 96 110 V 115 M 103 110 V 115" />
  </g>

  <!-- Nombre (serif, como la marca — mismo tamaño/color del grid) -->
  <text
    x="100" y="158"
    font-family="'IBM Plex Serif', Georgia, serif"
    font-weight="700" font-size="24"
    fill="#FAFAFA" text-anchor="middle" letter-spacing="1"
  >ARCADIA</text>

  <!-- Categoría -->
  <text
    x="100" y="176"
    font-family="Montserrat, Arial, sans-serif"
    font-weight="600" font-size="8"
    fill="#FAFAFA" text-anchor="middle" letter-spacing="2"
  >COMUNIDAD • MÉRIDA</text>
</svg>